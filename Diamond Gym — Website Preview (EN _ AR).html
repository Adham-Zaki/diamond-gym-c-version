        var ps=panel.querySelectorAll('p');ps[0].textContent=T[lang].title;ps[1].textContent=T[lang].body;
        panel.querySelector('pre').textContent=lines.join('\n');
        var a=panel.querySelector('a');a.href=url;a.textContent=T[lang].open;
        var b=panel.querySelector('button');b.textContent=T[lang].again;b.onclick=function(){panel.replaceWith(saved)};
        holder.replaceChild(panel,saved);
      });
    }
  }
  setLang('en');
})();
